name: Prowl integration

on:
  workflow_dispatch:
    inputs:
      PROWL_REF:
        description: Prowl tag or commit that overrides the pinned ref in .prowl-version
        default: ""
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/prowl-integration.yml
      - .prowl-version
      - docker-compose.yml
      - docker-compose-local.yml
      - scripts/prepare-prowl.sh
      - run.sh
      - src/prowl_client.py
      - tests/test_prowl_service.py

permissions:
  contents: read

concurrency:
  group: prowl-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      PROWL_GHCR_TOKEN: ${{ secrets.SECRET_GITHUB_PAT }}

    steps:
      - name: Check out rvx-builds
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull or build the local Prowl image
        env:
          PROWL_REF: ${{ inputs.PROWL_REF }}
        run: scripts/prepare-prowl.sh

      - name: Validate Compose configurations
        run: |
          for compose_file in docker-compose.yml docker-compose-local.yml; do
            for tty in false true; do
              COMPOSE_TTY="$tty" docker compose -f "$compose_file" config --quiet
            done
          done

      - name: Smoke-test the local Prowl image
        run: docker run --rm --entrypoint python prowl:local -c 'import prowl'
