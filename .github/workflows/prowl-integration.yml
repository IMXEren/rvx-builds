name: Prowl integration

on:
  workflow_dispatch:
    inputs:
      PROWL_REF:
        description: Prowl tag or commit to build
        default: main
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/prowl-integration.yml
      - docker-compose.yml
      - docker-compose-local.yml
      - scripts/build-prowl-local.sh
      - src/prowl_client.py
      - tests/test_prowl_service.py

permissions:
  contents: read

concurrency:
  group: prowl-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    if: github.repository == 'IMXEren/rvx-builds'
    runs-on: ubuntu-latest
    env:
      PROWL_REF: ${{ inputs.PROWL_REF || 'main' }}

    steps:
      - name: Check out rvx-builds
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check out Prowl source
        run: git clone --depth 1 --branch "$PROWL_REF" https://github.com/IMXEren/prowl.git "$RUNNER_TEMP/prowl"

      - name: Download private fingerprint fonts
        env:
          GH_TOKEN: ${{ secrets.SECRET_GITHUB_PAT }}
        run: |
          git lfs install
          gh repo clone IMXEren/extra-fonts "$RUNNER_TEMP/extra-fonts" -- --depth 1
          cp "$RUNNER_TEMP/extra-fonts/fonts.zip" resources/fonts.zip
          test "$(wc -c < resources/fonts.zip)" -gt 1000000

      - name: Validate Compose and build local Prowl image
        env:
          PROWL_BUILD_CONTEXT: ${{ runner.temp }}/prowl
          PROWL_FONTS_CONTEXT: ./resources
        run: |
          docker compose config --quiet
          docker compose -f docker-compose-local.yml config --quiet
          docker compose build prowl

      - name: Verify fingerprint fonts are installed
        run: docker run --rm --entrypoint sh prowl:local -c 'test -n "$(find /usr/share/fonts/windows -type f -print -quit)"'

      - name: Remove private font archive
        if: always()
        run: rm -f resources/fonts.zip
