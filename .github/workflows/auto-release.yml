name: Auto Build & Release
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  HAVE_TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID != '' }}
on:
  workflow_dispatch:
    inputs:
      TELEGRAM_NO_ROOT_UPLOAD:
        description: "Upload Non Rooted APKs to Telegram"
        required: false
        type: boolean
        default: false
      CACHE_RELEASES:
        description: "Persist older releases to not delete them on the run."
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "0 * * * *"
jobs:
  release-check:
    permissions: write-all
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    env:
      # Used to pass scheduled-run defaults to the build-release job.
      SCHEDULED_TELEGRAM_NO_ROOT_UPLOAD: false
      SCHEDULED_CACHE_RELEASES: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Update Env for custom build
        run: |
          echo "${{ secrets.ENVS }}" >> .env

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install uv with all available options
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.x"
          python-version: "3"
          activate-environment: "true"

      - name: Install Requirements
        run: |
          uv pip install -r requirements.txt

      - name: Should build?
        id: should_build
        shell: bash
        env:
          GITHUB_PAT: ${{ secrets.SECRET_GITHUB_PAT || secrets.GITHUB_TOKEN }}
          GITLAB_PAT: ${{ secrets.SECRET_GITLAB_PAT }}
        run: |
          output=$(python check_resource_updates.py)
          should_build="$(grep -m1 '^PATCH_APPS=' <<< "$output" | cut -d= -f2- | tr -d '\r' || printf '')"
          echo "SHOULD_BUILD=$should_build" >> $GITHUB_OUTPUT

      - name: Expose scheduled-run defaults
        id: scheduled_defaults
        run: |
          echo "TELEGRAM_NO_ROOT_UPLOAD=$SCHEDULED_TELEGRAM_NO_ROOT_UPLOAD" >> "$GITHUB_OUTPUT"
          echo "CACHE_RELEASES=$SCHEDULED_CACHE_RELEASES" >> "$GITHUB_OUTPUT"

      - name: Upload patch updates changelog
        uses: actions/upload-artifact@main
        if: ${{ steps.should_build.outputs.SHOULD_BUILD != '' }}
        with:
          name: Patch-Updates
          path: |
            patch-updates.md
          if-no-files-found: error
          retention-days: 0

    outputs:
      SHOULD_BUILD: ${{ steps.should_build.outputs.SHOULD_BUILD }}
      SCHEDULED_TELEGRAM_NO_ROOT_UPLOAD: ${{ steps.scheduled_defaults.outputs.TELEGRAM_NO_ROOT_UPLOAD }}
      SCHEDULED_CACHE_RELEASES: ${{ steps.scheduled_defaults.outputs.CACHE_RELEASES }}

  build-release:
    permissions: write-all
    needs: release-check
    uses: ./.github/workflows/build-apk.yml
    if: ${{ needs.release-check.outputs.SHOULD_BUILD != '' }}
    secrets: inherit
    concurrency:
      group: Auto-Release-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    with:
      PREFERRED_PATCH_APPS: ${{ needs.release-check.outputs.SHOULD_BUILD }}
      TELEGRAM_NO_ROOT_UPLOAD: >-
        ${{
          (github.event_name == 'schedule' && fromJSON(needs.release-check.outputs.SCHEDULED_TELEGRAM_NO_ROOT_UPLOAD))
          || (github.event_name != 'schedule' && inputs.TELEGRAM_NO_ROOT_UPLOAD)
        }}
      CACHE_RELEASES: >-
        ${{
          (github.event_name == 'schedule' && fromJSON(needs.release-check.outputs.SCHEDULED_CACHE_RELEASES))
          || (github.event_name != 'schedule' && inputs.CACHE_RELEASES)
        }}
